services:
  postgres:
    image: postgres:17-alpine
    container_name: vlr-fantasy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vlr_fantasy
      POSTGRES_PASSWORD: vlr_fantasy
      POSTGRES_DB: vlr_fantasy
    ports:
      - '5432:5432'
    volumes:
      - vlr_fantasy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vlr_fantasy -d vlr_fantasy']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vlr_fantasy_pgdata:
